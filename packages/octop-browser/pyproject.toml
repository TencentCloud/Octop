[build-system]
# hatchling>=1.30 defaults to Core Metadata 2.5; released twine / PyPI still
# reject that until warehouse + twine catch up. Cap the version, and keep an
# explicit 2.4 override so a newer hatchling cannot silently reintroduce 2.5.
requires = ["hatchling>=1.25,<1.33"]
build-backend = "hatchling.build"

[project]
name = "octop-browser"
version = "1.0.0"
description = "AI-friendly browser automation via CDP with profile-based login persistence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "orcakit" }]
keywords = ["browser", "automation", "ai", "cdp", "devtools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    # mcp 2.x removed the low-level Server.list_tools()/call_tool() decorators
    # that mcp_server.py registers at import time, so the <2 ceiling is required.
    "mcp>=1.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "coverage[toml]>=7.5",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/TencentCloud/octop-browser"
Repository = "https://github.com/TencentCloud/octop-browser"
Issues = "https://github.com/TencentCloud/octop-browser/issues"

[project.scripts]
octop-browser = "octop_browser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/octop_browser"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
# Embedded JS/CSS string literals and long generated skill-doc lines that
# cannot be wrapped without breaking the embedded code.
"src/octop_browser/actions/interact.py" = ["E501"]
"src/octop_browser/mcp_server.py" = ["E501"]
"src/octop_browser/record/daemon.py" = ["E501"]
"src/octop_browser/record/recorder.py" = ["E501"]
"src/octop_browser/record/replay.py" = ["E501"]
"src/octop_browser/record/skill_generator.py" = ["E501"]
"src/octop_browser/session.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/octop_browser"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that launch a real Chrome/Chromium browser",
]

[tool.coverage.run]
source = ["octop_browser"]
