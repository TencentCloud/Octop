[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "octop-harness"
# Single source of truth for the package version (runtime reads via importlib.metadata).
version = "1.0.5"
description = "Production-grade Harness Agent built on top of LangChain Deep Agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "octop contributors" }]
keywords = [
    "agent",
    "llm",
    "langchain",
    "langgraph",
    "deep-agents",
    "harness",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 0.7.16+ rejects sibling same-path file mutations in one model reply
    # (langchain-ai/deepagents#6446). Older 0.7.x can silently lose edits.
    "deepagents>=0.7.16,<0.8",
    "langchain>=1.4.2,<2.0",
    "langchain-core>=1.6.3,<2.0",
    # 1.3.3 preserves stateless Responses history without stored item references.
    "langchain-openai>=1.3.3,<2.0",
    "langchain-anthropic>=1.7.2,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "httpx>=0.27",
    "markdownify>=0.13",
    # 1.0.2 reconciles owner-maintained USER.md/MEMORY.md and isolates
    # structured runtime errors. This branch calls those APIs.
    "octop-memory>=1.0.2",
    "octop-browser>=0.9.9",
    "langchain-mcp-adapters>=0.3.0",
    # mcp 2.x breaks langchain-mcp-adapters (RequestContext import); pin until adapters support it.
    "mcp>=1.27.1,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Fine-grained extras (prefer these in error messages / minimal installs)
cli = ["click>=8.1", "rich>=13.0", "prompt-toolkit>=3.0", "python-dotenv>=1.0"]
bedrock = ["langchain-aws>=0.2"]
remote-backends = [
    "psycopg[binary]>=3.2",
    'deepagents-backends>=0.2; python_version >= "3.12"',
]
docker = ["docker>=7.0"]
opensandbox = ["opensandbox>=0.1.16,<1.2"]
observability = ["langfuse>=4.9.0"]
acp = ["agent-client-protocol>=0.9.0", "psutil>=5.9"]
# Aggregate extras (category installs; fine-grained extras remain preferred)
desktop = ["mss>=9.0", "pynput>=1.7", "pillow>=10.0"]
web-search-all = [
    "langchain-tavily>=0.1",
    "langchain-community>=0.3",
    "google-api-python-client>=2.0",
]
object-storage = [
    "cos-python-sdk-v5>=1.9",
    "oss2>=2.18",
    "esdk-obs-python>=3.24",
]
all = [  # library feature extras only; exclude cli — use [cli,all] when needed
    "langchain-aws>=0.2",
    "cos-python-sdk-v5>=1.9",
    "oss2>=2.18",
    "esdk-obs-python>=3.24",
    "mss>=9.0",
    "pynput>=1.7",
    "pillow>=10.0",
    "langchain-tavily>=0.1",
    "langchain-community>=0.3",
    "google-api-python-client>=2.0",
    "psycopg[binary]>=3.2",
    'deepagents-backends>=0.2; python_version >= "3.12"',
    "docker>=7.0",
    "langfuse>=4.9.0",
    "agent-client-protocol>=0.9.0",
    "psutil>=5.9",
]

[project.scripts]
octop-harness = "octop_harness.cli.main:cli"

[project.urls]
Homepage = "https://github.com/TencentCloud/octop-harness"
Repository = "https://github.com/TencentCloud/octop-harness"
Issues = "https://github.com/TencentCloud/octop-harness/issues"
Changelog = "https://github.com/TencentCloud/octop-harness/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-requests",
    # CLI extras — required to collect/run tests under tests/cli/
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    # ACP extras — required by tests/test_acp_*.py
    "agent-client-protocol>=0.9.0",
    "psutil>=5.9",
    "mss>=9.0",
    "octop-browser>=0.9.9",
    "langfuse>=4.9.0",
]

# ---------------------------------------------------------------------------
# Build (hatch)
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.3"
packages = ["src/octop_harness"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.3"
include = [
    "src/octop_harness",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "N",   # pep8-naming
    "PL",  # pylint
]
ignore = [
    "E203",    # whitespace before ':'
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLC0415", "RUF012", "N803"]
"examples/**/*.py" = ["PLC0415", "RUF001", "T201"]
# Intentional lazy / optional imports across the package
"src/octop_harness/**/*.py" = ["PLC0415"]
# Complexity / specialty rules (keep narrow so new code still gets flagged)
"src/octop_harness/backends/__init__.py" = ["PLR0911", "PLR0912", "E402"]
"src/octop_harness/cli/**/*.py" = ["PLR0911", "PLR0912", "PLR0915"]
"src/octop_harness/llm/factory.py" = ["PLR0912"]
"src/octop_harness/config/env.py" = ["PLR0912"]
"src/octop_harness/config/__init__.py" = ["PLR0912"]
"src/octop_harness/protocols/langgraph.py" = ["PLR0912"]
"src/octop_harness/acp/**/*.py" = ["PLR0911", "N818", "RUF006"]
"src/octop_harness/builtin/tools/acp_runner.py" = ["PLR0911"]
"src/octop_harness/builtin/skills/**/scripts/*.py" = ["PLR0911", "PLR0912", "PLR0915"]
# i18n: full-width punctuation in user-facing zh strings / comments
"src/octop_harness/slash/core.py" = ["RUF001"]
"src/octop_harness/middleware/memory.py" = ["RUF003"]
"src/octop_harness/context_usage.py" = ["PLR0912"]

[tool.ruff.lint.isort]
known-first-party = ["octop_harness"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
files = ["src/octop_harness"]
exclude = [
    "src/octop_harness/builtin/skills/",
]

[[tool.mypy.overrides]]
module = [
    "markdownify.*",
    "deepagents.*",
    "yaml.*",
    "qcloud_cos.*",
    "oss2.*",
    "obs.*",
    "deepagents_backends.*",
    "docker.*",
    "opensandbox",
    "opensandbox.*",
    "mss.*",
    "langchain_tavily.*",
    "langchain_community.*",
    "langchain_aws.*",
    "googleapiclient.*",
    "octop_browser.*",
    "octop_memory.*",
    "langfuse.*",
    "rich.*",
    "prompt_toolkit.*",
    "boto3.*",
    "botocore.*",
    "psycopg",
    "psycopg.*",
    "psutil.*",
    "fastmcp.*",
    "acp.*",
    "defusedxml.*",
    "pymupdf.*",
    "pymupdf4llm.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:langchain.*",
    # Python 3.14: google-genai still uses typing._UnionGenericAlias (issued from
    # typing.__eq__, so module filters on google.genai.* do not match).
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    # Python 3.14: langsmith still calls asyncio.iscoroutinefunction.
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    "ignore::DeprecationWarning:langsmith.*",
    # Python 3.14: sqlite3.Connection GC emits ResourceWarning; with
    # filterwarnings=error that becomes an unraisable during pytest_runtest_call
    # (before fixture teardown can close octop-memory / langgraph handles).
    "ignore:unclosed database in.*:ResourceWarning",
    "ignore:Exception ignored while finalizing database connection.*:pytest.PytestUnraisableExceptionWarning",
]
 
[tool.coverage.run]
source = ["src/octop_harness"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
