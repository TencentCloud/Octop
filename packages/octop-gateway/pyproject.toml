[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "octop-gateway"
version = "1.0.3"
description = "Multi-platform IM channel bridge with unified message abstraction for AI agents and bots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "octop contributors" }]
keywords = ["im", "bridge", "channel", "bot", "feishu", "dingtalk", "discord", "wechat", "qq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    # Platform SDKs
    "lark-oapi>=1.5.3",
    "dingtalk-stream>=0.24.3",
    "discord-py>=2.3",
    "python-socketio[asyncio_client]>=5.0",
    "websockets>=12.0",
    "websocket-client>=1.6.0",
    "httpx>=0.27.0",
    "wecom-aibot-sdk>=1.0.7",
    "paho-mqtt>=2.0.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
examples = [
    "openai>=2.38.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "langchain-core>=1.4.0",
    "octop-harness>=0.9.9",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.9",
    "pre-commit>=3.7",
    # Include examples deps for dev
    "openai>=2.38.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "langchain-core>=1.4.0",
    "octop-harness>=0.9.9",
]

[project.urls]
Homepage = "https://github.com/TencentCloud/octop-gateway"
Repository = "https://github.com/TencentCloud/octop-gateway"
Issues = "https://github.com/TencentCloud/octop-gateway/issues"
Changelog = "https://github.com/TencentCloud/octop-gateway/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/octop_gateway"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "B027",    # empty-method-without-abstract-decorator (intentional hooks)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF001"]  # intentional fullwidth punctuation in i18n tests

[tool.ruff.lint.isort]
known-first-party = ["octop_gateway"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
files = ["src/octop_gateway"]

[[tool.mypy.overrides]]
module = [
    "lark_oapi.*",
    "dingtalk_stream.*",
    "wecom_aibot_sdk.*",
    "paho.mqtt.*",
    "telegram.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring network access (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["octop_gateway"]
