<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#faf7f2; --paper:#ffffff; --ink:#2c2a28; --ink2:#5d574f; --ink3:#8b8378;
    --line:#e6ded2; --accent:#8b5e3c; --accent2:#b98a5a; --gold:#c9a227;
    --mu:#4a9d5f; --huo:#d1553f; --tu:#c08b3c; --jin:#8d8f96; --shui:#3f79b9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",serif;
    line-height:1.85; padding:32px 16px;
  }
  .wrap{max-width:920px;margin:0 auto}
  header{
    text-align:center;padding:36px 24px 28px;margin-bottom:26px;
    background:linear-gradient(160deg,#fffdf9 0%,#f7efe3 100%);
    border:1px solid var(--line);border-radius:14px;position:relative;
  }
  header::after{
    content:"";display:block;width:120px;height:2px;margin:18px auto 0;
    background:linear-gradient(90deg,transparent,var(--accent2),transparent);
  }
  h1{font-size:27px;letter-spacing:6px;font-weight:600;color:var(--accent)}
  .sub{margin-top:8px;color:var(--ink3);font-size:13px;letter-spacing:1px}
  section{
    background:var(--paper);border:1px solid var(--line);border-radius:12px;
    padding:24px 26px;margin-bottom:20px;
  }
  h2{
    font-size:18px;color:var(--accent);margin-bottom:16px;letter-spacing:3px;
    padding-left:11px;border-left:4px solid var(--accent2);font-weight:600;
  }
  h3{font-size:15px;color:var(--ink);margin:16px 0 8px;letter-spacing:1px}
  p{margin-bottom:10px;color:var(--ink2);font-size:14.5px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 20px}
  .kv div{font-size:13.5px;color:var(--ink2)}
  .kv b{color:var(--ink3);font-weight:400;display:inline-block;min-width:62px}
  /* 四柱 */
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 4px}
  .pillar{
    border:1px solid var(--line);border-radius:10px;padding:14px 8px;text-align:center;
    background:linear-gradient(180deg,#fffdf9,#faf5ec);
  }
  .p-label{font-size:12px;color:var(--ink3);letter-spacing:2px}
  .p-gan{font-size:30px;font-weight:600;margin:6px 0 2px;letter-spacing:2px;line-height:1.2}
  .p-zhi{font-size:26px;font-weight:600;letter-spacing:2px}
  .p-ss{font-size:12.5px;color:var(--accent);margin-top:6px}
  .p-meta{font-size:11.5px;color:var(--ink3);margin-top:8px;line-height:1.6;
          border-top:1px dashed var(--line);padding-top:6px}
  .p-hide{font-size:11px;color:var(--ink3)}
  /* 五行 */
  .wxbar{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13px}
  .wxbar .nm{width:26px;color:var(--ink2)}
  .wxbar .track{flex:1;height:14px;background:#f2ece3;border-radius:7px;overflow:hidden}
  .wxbar .fill{height:100%;border-radius:7px}
  .wxbar .num{width:58px;text-align:right;color:var(--ink3);font-size:12.5px}
  /* 表格 */
  table{width:100%;border-collapse:collapse;font-size:13.2px;margin-top:6px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
  th{background:#faf5ec;color:var(--ink2);font-weight:600;letter-spacing:1px}
  tr:hover td{background:#fdfaf5}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;
       border:1px solid var(--line);color:var(--ink2);margin:2px 3px 2px 0;background:#fdfaf5}
  .tag.good{color:#3f7d4f;border-color:#cfe4d4;background:#f2f9f4}
  .tag.warn{color:#b5651d;border-color:#f0dcc0;background:#fdf7ee}
  .tag.bad{color:#b23b2c;border-color:#f0cdc7;background:#fdf3f1}
  .narr{background:#fdfaf4;border:1px dashed var(--line);border-radius:8px;
        padding:14px 16px;margin-top:10px;font-size:14.2px;color:var(--ink2)}
  .narr:empty{display:none}
  ul{margin:6px 0 6px 20px;font-size:14px;color:var(--ink2)}
  li{margin-bottom:5px}
  .empty{color:var(--ink3);font-size:13px;font-style:italic}
  footer{text-align:center;color:var(--ink3);font-size:12px;padding:18px 10px 6px;line-height:1.9}
  .disc{background:#fff8f2;border:1px solid #f0dcc0;border-radius:10px;padding:16px 18px;
        font-size:12.8px;color:#8a6b45;line-height:1.9}
  @media(max-width:640px){
    .pillars{grid-template-columns:repeat(2,1fr)}
    body{padding:16px 8px}
  }
</style>
</head>
<body>
<div class="wrap">
{{BODY}}
</div>
</body>
</html>
