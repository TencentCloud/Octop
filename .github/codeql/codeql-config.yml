name: "Octop CodeQL"

# Upstream protocol request-signing digests use SHA-256 (not password storage).
# Fliggy is fully excluded; WeCom uses an inline # codeql[py/weak-sensitive-data-hashing]
# on _wecom_mcp_signature instead (file also has PBKDF2 credential fingerprints).
paths-ignore:
  - src/octop/infra/connectors/gateway/adapters/fliggy.py
