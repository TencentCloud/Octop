name: Helm Publish

# 版本标签 v* 上把 deploy/helm/octop 打成包，推到与镜像相同的 GHCR。
# 不另建 HTTP Helm 仓库。安装地址：
#   oci://ghcr.io/tencentcloud/octop/charts/octop
#
# Chart 源码仍在仓库里。克隆后用目录安装；没有仓库的机器用上面的 OCI 地址。
# 推送时改写版本，不把改写提交回 git：
#   appVersion = 镜像 tag（v1.0.3b5 → 1.0.3b5）
#   version    = Helm SemVer（1.0.3b5 → 1.0.3-b5，1.0.3 保持 1.0.3）
#
# 触发与 docker-publish.yml 相同：推送 v*，或 workflow_dispatch 填 tag。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "v* tag to publish (e.g. v1.0.3b5). Required when not running on a tag."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Push chart to GHCR
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    steps:
      - name: Resolve version from tag ref
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            ref="$DISPATCH_TAG"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          case "$ref" in
            v*)
              version="${ref#v}"
              ;;
            *)
              echo "::error::Expected v* tag, got ref=$ref"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Set chart version from the release tag
        env:
          OCTOP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import re
          from pathlib import Path
          image_tag = os.environ["OCTOP_VERSION"]
          match = re.fullmatch(r"(\d+\.\d+\.\d+)([A-Za-z].*)?", image_tag)
          if match is None:
              raise SystemExit(f"unsupported version {image_tag}")
          base, pre = match.group(1), match.group(2)
          chart_version = f"{base}-{pre}" if pre else base
          path = Path("deploy/helm/octop/Chart.yaml")
          text = path.read_text()
          text = re.sub(r"(?m)^version:.*$", f"version: {chart_version}", text, count=1)
          text = re.sub(r'(?m)^appVersion:.*$', f'appVersion: "{image_tag}"', text, count=1)
          path.write_text(text)
          print(f"chart {chart_version}, image tag {image_tag}")
          PY

      - name: Lint and package
        run: |
          set -euo pipefail
          helm lint deploy/helm/octop
          helm package deploy/helm/octop --destination /tmp/octop-chart

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart
        env:
          GHCR: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          registry="$(echo "$GHCR" | tr '[:upper:]' '[:lower:]')"
          helm push /tmp/octop-chart/octop-*.tgz "oci://${registry}/charts"

      # gh api percent-encodes the path again, so a pre-encoded slash becomes %252F.
      # Call the API directly. The chart lives at octop/charts/octop so it does
      # not replace the container image package named octop.
      - name: Mark the GHCR chart package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          package="$(python3 -c 'import urllib.parse; print(urllib.parse.quote("octop/charts/octop", safe=""))')"
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/${owner}/packages/container/${package}/visibility" \
            -d '{"visibility":"public"}'
