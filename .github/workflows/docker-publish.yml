name: Docker Publish

# 仅在版本标签（v*）上构建并同步发布镜像到 Docker Hub 与 GHCR。
# 文档与对外引用统一使用：ghcr.io/tencentcloud/octop
# （Hub 仍用 DOCKERHUB_* secrets 同步推送。）
#
# 架构：ubuntu-latest 打 linux/amd64，ubuntu-24.04-arm 打 linux/arm64，
# 再合并为 :{version} / :latest 多架构清单。飞牛 Docker 版 FPK 共用一份，
# NAS 按本机架构拉取对应镜像层。
#
# 触发路径：
#   1. 人工推送 v* tag → on.push.tags
#   2. Auto Tag 用 GITHUB_TOKEN 推 tag 后显式 workflow_dispatch（token push 不会触发 push 工作流）
#   3. 在任意分支 Run workflow，填 tag=vX.Y.Z（用该分支的 workflow 文件，checkout 指定 tag）
#
# 注意：workflow_dispatch 下 metadata-action 的 type=semver 不可靠，
# 必须从 tag / 输入显式解析版本号。
# 不要把 DOCKERHUB_USERNAME 放进 job outputs：跨 job 传递会被抹成空，
# 导致只推 GHCR，合并清单时再对空 Hub 名失败。
#
# FnOS FPK 由 Release 成功后自动 dispatch，并等待本工作流推送的 :{version} 就绪。
#
# 拉取示例：
#   docker pull ghcr.io/tencentcloud/octop:latest
#   docker pull ghcr.io/tencentcloud/octop:0.9.28
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "v* tag to publish (e.g. v1.0.2b6). Required when not running on a tag."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    # 拒绝在非 v* ref 上误跑（例如 UI 里对 main 点 Run workflow 且未填 tag）
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ghcr: ${{ steps.image.outputs.ghcr }}
    steps:
      - name: Resolve version from tag ref
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            ref="$DISPATCH_TAG"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          case "$ref" in
            v*)
              echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected v* tag, got ref=$ref"
              exit 1
              ;;
          esac

      - name: Image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_USER != '' && format('{0}/octop', env.DOCKERHUB_USER) || '' }}
            ${{ needs.prepare.outputs.ghcr }}
          # 单架构中间 tag；:{version} / :latest 由 merge 合成多架构清单
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

  merge:
    name: Multi-arch manifest
    needs: [prepare, build]
    # ARM runner 偶发失败时仍发布已有架构，避免卡住 :{version} 与 Docker FPK。
    if: always() && needs.prepare.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VER: ${{ needs.prepare.outputs.version }}
          GHCR: ${{ needs.prepare.outputs.ghcr }}
          HUB: ${{ env.DOCKERHUB_USER != '' && format('{0}/octop', env.DOCKERHUB_USER) || '' }}
        run: |
          set -euo pipefail
          any_multi=0
          for REG in "$GHCR" "$HUB"; do
            [ -n "$REG" ] || continue
            sources=()
            for arch in amd64 arm64; do
              if docker buildx imagetools inspect "${REG}:${VER}-${arch}" >/dev/null 2>&1; then
                sources+=("${REG}:${VER}-${arch}")
              else
                echo "::warning::missing ${REG}:${VER}-${arch}"
              fi
            done
            if [ "${#sources[@]}" -eq 0 ]; then
              echo "::error::No platform images published for ${REG}:${VER}"
              exit 1
            fi
            if [ "${#sources[@]}" -ge 2 ]; then
              any_multi=1
            fi
            docker buildx imagetools create \
              -t "${REG}:${VER}" \
              -t "${REG}:latest" \
              "${sources[@]}"
            echo "=== ${REG}:${VER} ==="
            docker buildx imagetools inspect "${REG}:${VER}"
          done
          if [ "$any_multi" -eq 0 ]; then
            echo "::warning:::${VER} is not multi-arch (ARM image missing). Docker FPK on ARM NAS will not run."
          fi
