name: Docker Publish

# 仅在版本标签（v*）上构建并发布镜像到 GHCR。
# 服务镜像名由仓库名小写得出：ghcr.io/kolehank/octop
# 沙箱镜像：ghcr.io/kolehank/agentbuddy-sandbox（同一 tag 策略，见 sandbox job）
#
# 架构：ubuntu-latest 打 linux/amd64，ubuntu-24.04-arm 打 linux/arm64，
# 再合并为 :{version} / :latest 多架构清单。
#
# 触发路径：
#   1. 人工推送 v* tag → on.push.tags
#   2. Auto Tag 用 GITHUB_TOKEN 推 tag 后显式 workflow_dispatch（token push 不会触发 push 工作流）
#   3. 在任意分支 Run workflow，填 tag=vX.Y.Z（用该分支的 workflow 文件，checkout 指定 tag）
#
# 注意：workflow_dispatch 下 metadata-action 的 type=semver 不可靠，
# 必须从 tag / 输入显式解析版本号。
#
# 拉取示例：
#   docker pull ghcr.io/kolehank/octop:latest
#   docker pull ghcr.io/kolehank/octop:0.9.28
#   docker pull ghcr.io/kolehank/agentbuddy-sandbox:1.0.0   # agent 沙箱镜像
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "v* tag to publish (e.g. v1.0.2b6). Required when not running on a tag."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    # 拒绝在非 v* ref 上误跑（例如 UI 里对 main 点 Run workflow 且未填 tag）
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      ghcr: ${{ steps.image.outputs.ghcr }}
    steps:
      - name: Resolve version from tag ref
        id: ver
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_TAG:-}" ]; then
            ref="$DISPATCH_TAG"
          else
            ref="${GITHUB_REF_NAME}"
          fi
          case "$ref" in
            v*)
              echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
              echo "tag=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Expected v* tag, got ref=$ref"
              exit 1
              ;;
          esac

      - name: Image names
        id: image
        run: |
          echo "ghcr=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.ghcr }}
          # 单架构中间 tag；:{version} / :latest 由 merge 合成多架构清单
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}-${{ matrix.arch }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

  merge:
    name: Multi-arch manifest
    needs: [prepare, build]
    # ARM runner 偶发失败时仍发布已有架构，避免卡住 :{version}。
    if: always() && needs.prepare.result == 'success' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          VER: ${{ needs.prepare.outputs.version }}
          GHCR: ${{ needs.prepare.outputs.ghcr }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            if docker buildx imagetools inspect "${GHCR}:${VER}-${arch}" >/dev/null 2>&1; then
              sources+=("${GHCR}:${VER}-${arch}")
            else
              echo "::warning::missing ${GHCR}:${VER}-${arch}"
            fi
          done
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "::error::No platform images published for ${GHCR}:${VER}"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${GHCR}:${VER}" \
            -t "${GHCR}:latest" \
            "${sources[@]}"
          echo "=== ${GHCR}:${VER} ==="
          docker buildx imagetools inspect "${GHCR}:${VER}"
          if [ "${#sources[@]}" -lt 2 ]; then
            echo "::warning:::${VER} is not multi-arch (ARM image missing). ARM hosts will pull no matching layer."
          fi

  # ---------------------------------------------------------------------------
  # Agent 沙箱镜像（docker/Dockerfile.sandbox）——与主镜像同 tag 策略发布。
  # 沙箱是 agent 执行命令/技能运行的地基（工具链 + 技能依赖白名单），Dockerfile
  # 改动必须有 CI 回归保护；产物进 GHCR 供政务内网 docker pull 或 save/load 离线导入。
  #
  # 源选择分工（重要）：
  #   - CI（GitHub runner，公网）显式传 --build-arg 回**官方源**——默认国内源
  #     （清华/阿里/npmmirror）在公网可达但慢且非本流程职责；
  #   - 政务内网手工构建时才用国内源/内网 Nexus（见 docker/README_CN.md 的
  #     构建参数表），沙箱运行期镜像里不留任何源配置。
  sandbox-build:
    name: Sandbox Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sandbox image names
        id: image
        run: |
          set -euo pipefail
          # ghcr.io/kolehank/octop → ghcr.io/kolehank/agentbuddy-sandbox
          ghcr="${{ needs.prepare.outputs.ghcr }}"
          echo "ghcr=${ghcr%/*}/agentbuddy-sandbox" >> "$GITHUB_OUTPUT"

      - name: Build and push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.sandbox
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ steps.image.outputs.ghcr }}:${{ needs.prepare.outputs.version }}
            ${{ steps.image.outputs.ghcr }}:latest
          # CI 走官方源（内网手工构建才用国内源/Nexus，见 docker/README_CN.md）
          build-args: |
            APT_MIRROR=deb.debian.org
            PIP_INDEX_URL=https://pypi.org/simple
            NPM_REGISTRY=https://registry.npmjs.org
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=sandbox-${{ matrix.arch }}
