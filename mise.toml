# Local toolchain pins. Versions follow CI / Docker, not the host default.
#
# python 3.12  — CI matrix, Makefile `uv venv --python 3.12`
# node 20      — docker/Dockerfile, release.yml, fnos-build-fpk.yml,
#                 octop-desktop.yml, dashboard/ (its lockfile is npm 10)
#                 desktop/src/ overrides this to Node 24 in its own
#                 mise.toml — `node --test` type stripping needs >=22.6 there,
#                 and Node 24 is the only place it is used.
# npm 10       — bundled with Node 20; explicit so `npm ci` does not drift
# uv           — Makefile / pyproject package manager. Stays at the repo root:
#                 child mise.toml files do not apply upward, and `make` / `uv`
#                 run from here. pnpm is pinned in desktop/src/mise.toml.
[tools]
python = "3.12"
node = "20"
npm = "10"
uv = "latest"
