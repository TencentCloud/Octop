# Local toolchain pins. Versions follow CI / Docker, not the host default.
#
# python 3.12  — CI matrix, Makefile `uv venv --python 3.12`
# node 22      — docker/Dockerfile, release.yml, fnos-build-fpk.yml
#                 (minimum 22.19 for Office previews; octop-desktop.yml uses 24)
# npm 10       — kept at the existing major; explicit so `npm ci` does not drift
# uv           — Makefile / pyproject package manager
[tools]
python = "3.12"
node = "22"
npm = "10"
uv = "latest"
