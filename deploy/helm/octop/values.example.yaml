# Install sample. Copy it, change the hostname, image, and resources, then:
#   helm upgrade --install octop oci://ghcr.io/tencentcloud/octop/charts/octop \
#     --version 1.0.3-b7 -n octop -f my-values.yaml
#
# Do not put passwords in this file. Create Secrets before install. See secrets.example.yaml.
#   octop-admin  username / password     console login; used only on first init
#   octop-pg     user / password / database   PostgreSQL login, not the console password
#   octop-tls    hostname certificate. Required when ingress.tls.enabled is true

# Replica count. There is no HPA. Change this value and upgrade.
replicaCount: 2

image:
  repository: ghcr.io/tencentcloud/octop
  # Empty uses the chart appVersion. Set a tag that exists in the registry.
  # The lite image has no virtual desktop, local embeddings, or OCR. Those need
  # a <version>-full tag and shm below.
  tag: "1.0.3b7"
  pullPolicy: IfNotPresent

# The full image needs about 1Gi of /dev/shm. Leave this false for the lite image.
shm:
  enabled: false
  sizeLimit: 1Gi

config:
  # Console time and cron use this timezone.
  timezone: Asia/Shanghai
  # Empty becomes https://<ingress.host>. For several origins, use a
  # comma-separated list of full URLs.
  corsOrigins: ""

# Secret names. Create them with kubectl first. The chart does not render passwords.
secrets:
  database: octop-pg
  admin: octop-admin

# Use an already deployed CubeSandbox. Pick an Octop release that includes
# CubeSandbox support. Credentials stay in a Secret created beforehand. This
# field is only that Secret's name and stays empty by default. See the README
# for an example name.
cubeSandbox:
  enabled: false
  apiUrl: ""
  proxyNodeIP: ""
  proxyPortHTTP: ""
  existingSecret: ""

service:
  port: 8088

ingress:
  # Set false when there is no hostname, or the ingress class is not NGINX,
  # then use kubectl port-forward.
  enabled: true
  # MicroK8s Traefik often uses the class name public. Replace the nginx
  # annotations below when you do.
  className: nginx
  host: octop.example.com
  tls:
    enabled: true
    secretName: octop-tls
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-name: OCTOP_AFFINITY
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-samesite: Lax
    nginx.ingress.kubernetes.io/session-cookie-expires: "10800"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "10800"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

# Bundled pgvector. Set enabled to false and set database.host below for a
# managed database. The managed database must already allow CREATE EXTENSION vector.
postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  persistence:
    size: 20Gi
    # An empty string uses the cluster default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

# host is used only when postgresql.enabled is false.
database:
  host: ""
  port: 5432

# Usually leave these empty. With release name octop, resource names are octop
# and octop-pgvector.
nameOverride: ""
fullnameOverride: ""
