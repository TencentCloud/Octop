apiVersion: v1
kind: Service
metadata:
  name: {{ include "octop.fullname" . }}
  labels:
    {{- include "octop.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "octop.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
