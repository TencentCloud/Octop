# Sample. Replace the placeholders, then apply it in the release namespace:
#   kubectl -n octop apply -f secrets.example.yaml
# Do not commit the filled-in file. The chart does not create these Secrets from values.
#
# octop-admin is the console login. It is used only to create the admin on first init.
# The password must be at least 8 characters, contain both letters and digits, and
# must not be a common password. Otherwise no admin is created and each Pod starts
# the setup wizard on its own. After the first boot, changing this Secret does not
# change the console password already stored.
#
# octop-pg is the PostgreSQL database name, user, and password. It is not the
# console password. After the volume is initialized, changing it does not change
# the role already stored. To change the database password, run ALTER USER in the
# database, then update this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: octop-pg
type: Opaque
stringData:
  user: octop
  password: REPLACE_WITH_DB_PASSWORD
  database: octop
---
apiVersion: v1
kind: Secret
metadata:
  name: octop-admin
type: Opaque
stringData:
  username: admin
  password: REPLACE_WITH_ADMIN_PASSWORD
# When Ingress TLS is enabled, also create the hostname certificate. Do not mix
# it into the stringData of the Secrets above. Create the certificate and key
# from files:
#
#   kubectl -n octop create secret tls octop-tls \
#     --cert=fullchain.pem --key=privkey.pem
#
# With no hostname, do not create this Secret. Install with
# --set ingress.enabled=false. If Ingress stays on but TLS is off, set
# nginx.ingress.kubernetes.io/session-cookie-secure to "false".
