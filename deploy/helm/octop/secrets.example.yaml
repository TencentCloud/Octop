# 样例。把占位符换成真实口令后，在 release 所在命名空间执行：
#   kubectl -n octop apply -f secrets.example.yaml
# 不要把填好的文件提交进仓库。Chart 不会根据 values 生成这些 Secret。
#
# octop-admin 是控制台登录账号，只在第一次初始化时用来创建管理员。
# 密码至少 8 位，同时包含字母和数字，并且不要用常见弱密码。
# 不合格时不会建管理员，每个 Pod 各自进入设置向导。
# 初始化完成后再改这个 Secret，不会改掉已经建好的控制台密码。
#
# octop-pg 是 PostgreSQL 的库名、用户和口令，不是控制台密码。
# 数据卷初始化完成后再改它，不会改掉库里已经建好的账号。
# 要换数据库口令，先在库里 ALTER USER，再更新这里。
apiVersion: v1
kind: Secret
metadata:
  name: octop-pg
type: Opaque
stringData:
  user: octop
  password: REPLACE_WITH_DB_PASSWORD
  database: octop
---
apiVersion: v1
kind: Secret
metadata:
  name: octop-admin
type: Opaque
stringData:
  username: admin
  password: REPLACE_WITH_ADMIN_PASSWORD
# 开启 Ingress TLS 时还要有域名证书，不要和上面两个 Secret 混在一个 stringData 里。
# 证书和私钥用文件创建：
#
#   kubectl -n octop create secret tls octop-tls \
#     --cert=fullchain.pem --key=privkey.pem
#
# 没有域名时不要建这个 Secret，安装时加 --set ingress.enabled=false。
# 关掉 TLS 但仍使用 Ingress 时，把
# nginx.ingress.kubernetes.io/session-cookie-secure 设为 "false"。
