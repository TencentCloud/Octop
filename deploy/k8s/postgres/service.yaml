# Headless Service for the StatefulSet. Clients use octop-pgvector:5432.

apiVersion: v1
kind: Service
metadata:
  name: octop-pgvector
  labels:
    app.kubernetes.io/name: octop
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: octop
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
