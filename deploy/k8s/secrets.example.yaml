# Example only. Replace the passwords and apply this file on its own.
# Do not commit filled-in secrets. This file is not in kustomization.yaml.
#
# The admin password must be at least 8 characters and contain both letters
# and digits, and it must not be a common password. Otherwise the entrypoint
# does not create an admin and each Pod starts the setup wizard on its own.
apiVersion: v1
kind: Secret
metadata:
  name: octop-pg
  namespace: octop
type: Opaque
stringData:
  user: octop
  password: REPLACE_WITH_DB_PASSWORD
  database: octop
---
apiVersion: v1
kind: Secret
metadata:
  name: octop-admin
  namespace: octop
type: Opaque
stringData:
  username: admin
  password: REPLACE_WITH_ADMIN_PASSWORD
