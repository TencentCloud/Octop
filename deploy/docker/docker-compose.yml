# =============================================================================
# Octop — Docker Compose
#
# From the repository root:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#   OCTOP_PORT=9090 docker compose -f deploy/docker/docker-compose.yml up -d
#   OCTOP_DEFAULT_PASSWORD=<your-strong-password> docker compose -f deploy/docker/docker-compose.yml up -d
#
# Optional deploy/docker/.env (Compose interpolation only), for example:
#   OCTOP_PORT=9090
#   OCTOP_DEFAULT_PASSWORD=<your-strong-password>
#   OCTOP_ADMIN_USERNAME=admin
#   OCTOP_DATABASE_DRIVER=postgresql
#   OCTOP_DATABASE_URL=postgresql://octop:octop@host.docker.internal:5432/octop
#
# A key in deploy/docker/.env reaches the container only when listed under
# environment below. The same keys can also live in ~/.octop/env on the
# mounted data directory.
# The password must be at least 8 characters and contain both letters and
# digits. If it is unset or rejected, no admin is created and the setup
# wizard starts (unlock password in /data/.octop/octop-login.txt).
# =============================================================================

services:
  octop:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: octop:latest
    container_name: octop
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # Xvnc needs more than Docker's default 64MB /dev/shm after the user enables the desktop.
    shm_size: "1gb"
    ports:
      - "${OCTOP_PORT:-8088}:${OCTOP_PORT:-8088}"
    volumes:
      - ${OCTOP_DATA:-~/.octop}:/data/.octop
    environment:
      - HOME=/data
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=${OCTOP_PORT:-8088}
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL:-info}
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD:-}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME:-admin}
      - OCTOP_ADMIN_DISPLAY_NAME=${OCTOP_ADMIN_DISPLAY_NAME:-Admin}
      - OCTOP_DATABASE_URL=${OCTOP_DATABASE_URL:-}
      - OCTOP_DATABASE_DRIVER=${OCTOP_DATABASE_DRIVER:-}
      - OCTOP_DATABASE_SQLITE_PATH=${OCTOP_DATABASE_SQLITE_PATH:-}
      - OCTOP_DATABASE_HOST=${OCTOP_DATABASE_HOST:-}
      - OCTOP_DATABASE_PORT=${OCTOP_DATABASE_PORT:-}
      - OCTOP_DATABASE_NAME=${OCTOP_DATABASE_NAME:-}
      - OCTOP_DATABASE_USER=${OCTOP_DATABASE_USER:-}
      - OCTOP_DATABASE_PASSWORD=${OCTOP_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
