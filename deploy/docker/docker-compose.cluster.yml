# =============================================================================
# Lab: one PostgreSQL and two Octop processes with separate data directories.
#
# From the repository root:
#   OCTOP_DEFAULT_PASSWORD='<8+ chars, letters and digits>' \
#     docker compose -f deploy/docker/docker-compose.cluster.yml up -d
#
# Host ports 8088 and 8089 both serve the same database. They are for checking
# that two processes share one control plane. Production traffic should enter
# through one sticky proxy (cookie affinity, long WebSocket timeout), not
# through these two ports directly.
#
# Do not mount one volume on both Octop services. Local workspace files and
# the Feishu dedup database are single-writer.
# =============================================================================

services:
  octop-a:
    image: ghcr.io/tencentcloud/octop:latest
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8088:8088"
    volumes:
      - octop_a:/data/.octop
    environment:
      - HOME=/data
      - OCTOP_HOME=/data/.octop
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=8088
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD:?set an admin password of at least 8 characters with letters and digits}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME:-admin}
      - OCTOP_DEFAULT_TIMEZONE=${OCTOP_DEFAULT_TIMEZONE:-Asia/Shanghai}
      - OCTOP_CORS_ORIGINS=${OCTOP_CORS_ORIGINS:-}
      - OCTOP_DATABASE_DRIVER=postgresql
      - OCTOP_DATABASE_HOST=postgres
      - OCTOP_DATABASE_PORT=5432
      - OCTOP_DATABASE_NAME=${OCTOP_PG_DB:-octop}
      - OCTOP_DATABASE_USER=${OCTOP_PG_USER:-octop}
      - OCTOP_DATABASE_PASSWORD=${OCTOP_PG_PASSWORD:-octop}
      - OCTOP_DATABASE_URL=${OCTOP_DATABASE_URL:-}

  octop-b:
    image: ghcr.io/tencentcloud/octop:latest
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8089:8088"
    volumes:
      - octop_b:/data/.octop
    environment:
      - HOME=/data
      - OCTOP_HOME=/data/.octop
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=8088
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD:?set an admin password of at least 8 characters with letters and digits}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME:-admin}
      - OCTOP_DEFAULT_TIMEZONE=${OCTOP_DEFAULT_TIMEZONE:-Asia/Shanghai}
      - OCTOP_CORS_ORIGINS=${OCTOP_CORS_ORIGINS:-}
      - OCTOP_DATABASE_DRIVER=postgresql
      - OCTOP_DATABASE_HOST=postgres
      - OCTOP_DATABASE_PORT=5432
      - OCTOP_DATABASE_NAME=${OCTOP_PG_DB:-octop}
      - OCTOP_DATABASE_USER=${OCTOP_PG_USER:-octop}
      - OCTOP_DATABASE_PASSWORD=${OCTOP_PG_PASSWORD:-octop}
      - OCTOP_DATABASE_URL=${OCTOP_DATABASE_URL:-}

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OCTOP_PG_USER:-octop}
      POSTGRES_PASSWORD: ${OCTOP_PG_PASSWORD:-octop}
      POSTGRES_DB: ${OCTOP_PG_DB:-octop}
    volumes:
      - octop_pgdata:/var/lib/postgresql/data
      - ./postgres/init-vector.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  octop_a:
  octop_b:
  octop_pgdata:
