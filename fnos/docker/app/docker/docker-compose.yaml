services:
  octop:
    image: jubaoliang/octop:latest
    container_name: octop
    restart: unless-stopped
    pull_policy: always
    ports:
      - "8088:8088"
    volumes:
      - "/var/apps/octop/share/octop/data:/data/.octop"
    environment:
      - HOME=/data
      - OCTOP_BIND_HOST=0.0.0.0
      - OCTOP_PORT=${OCTOP_PORT:-8088}
      - OCTOP_LOG_LEVEL=${OCTOP_LOG_LEVEL:-info}
      - OCTOP_DEFAULT_PASSWORD=${OCTOP_DEFAULT_PASSWORD:-Octop123}
      - OCTOP_ADMIN_USERNAME=${OCTOP_ADMIN_USERNAME:-admin}
      - OCTOP_ADMIN_DISPLAY_NAME=${OCTOP_ADMIN_DISPLAY_NAME:-Admin}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      # 飞牛 FPK 部署标识：禁止容器内在线升级（octop update / 面板「立即升级」），
      # 升级请通过飞牛应用中心更新 FPK（应用中心更新时会重新拉取镜像）。
      - OCTOP_INSTALL_MODE=fpk-docker
