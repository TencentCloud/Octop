<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favico.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- PWA: theme color (light / dark) -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1c28"
      media="(prefers-color-scheme: dark)"
    />
    <!-- PWA: standalone mode for iOS Safari -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Octop" />
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <title>Octop</title>
    <!--
      Classic script (not type=module) so it runs even when hashed chunks 404.
      Shares octop:chunk-reload with reloadOnStaleChunk.ts.
    -->
    <script>
      (function () {
        var KEY = "octop:chunk-reload";
        function isAsset(url) {
          return typeof url === "string" && url.indexOf("/assets/") !== -1;
        }
        function recover() {
          try {
            if (sessionStorage.getItem(KEY) === "1") {
              sessionStorage.removeItem(KEY);
              return;
            }
            sessionStorage.setItem(KEY, "1");
          } catch (e) {}
          var reload = function () {
            location.reload();
          };
          var bust = Promise.resolve();
          if ("serviceWorker" in navigator) {
            bust = navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  }),
                );
              });
          }
          if ("caches" in window) {
            bust = bust.then(function () {
              return caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              });
            });
          }
          bust.then(reload, reload);
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return;
            if (t.tagName === "SCRIPT" && isAsset(t.src)) recover();
            if (t.tagName === "LINK" && isAsset(t.href)) recover();
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
