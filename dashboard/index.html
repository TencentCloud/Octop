<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favico.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- PWA: theme color (light / dark) -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1a1c28"
      media="(prefers-color-scheme: dark)"
    />
    <!-- PWA: standalone mode for iOS Safari -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Octop" />
    <!-- Web App Manifest -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <title>Octop</title>
    <!--
      Resolve dashboard theme before first paint. Must stay a classic script:
      the splash CSS keys off html[data-theme], not prefers-color-scheme,
      so a stored "light" preference wins over an OS dark setting.
      Storage shape matches appearanceStorage.ts (THEME_STORAGE_KEY = "theme").

      The desktop shell loads this page with ?octopTheme=system|light|dark
      (DASHBOARD_THEME_QUERY in desktop/src/main/windows/chrome.ts). That
      device preference wins over localStorage and is written back, then the
      query is removed so a later reload keeps the stored value. Browser
      loads have no query and keep using localStorage alone.
    -->
    <script id="octop-boot-theme">
      (function () {
        var KEY = "theme";
        var mode = "light";
        function systemDark() {
          try {
            return window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            return false;
          }
        }
        function isPref(value) {
          return value === "light" || value === "dark" || value === "system";
        }
        function readStoredPref() {
          var raw = localStorage.getItem(KEY);
          if (isPref(raw)) return raw;
          if (!raw) return "system";
          var parsed = JSON.parse(raw);
          if (parsed && isPref(parsed.preference)) return parsed.preference;
          return "system";
        }
        function shellPref() {
          var query = new URLSearchParams(window.location.search).get(
            "octopTheme",
          );
          return isPref(query) ? query : null;
        }
        // Keep palette / customColor; only the light/dark preference moves.
        function rememberShellPref(pref) {
          var next = { preference: pref };
          try {
            var raw = localStorage.getItem(KEY);
            if (raw && raw.charAt(0) === "{") {
              var parsed = JSON.parse(raw);
              if (parsed && typeof parsed.palette === "string") {
                next.palette = parsed.palette;
              }
              if (parsed && typeof parsed.customColor === "string") {
                next.customColor = parsed.customColor;
              }
            }
          } catch (e) {}
          localStorage.setItem(KEY, JSON.stringify(next));
          try {
            var url = new URL(window.location.href);
            url.searchParams.delete("octopTheme");
            history.replaceState(
              null,
              "",
              url.pathname + url.search + url.hash,
            );
          } catch (e2) {}
        }
        try {
          var fromShell = shellPref();
          var pref = fromShell || "system";
          if (fromShell) rememberShellPref(fromShell);
          else pref = readStoredPref();
          if (pref === "dark" || (pref === "system" && systemDark())) {
            mode = "dark";
          }
        } catch (e) {
          if (systemDark()) mode = "dark";
        }
        document.documentElement.setAttribute("data-theme", mode);
        var themeColor = mode === "dark" ? "#1a1c28" : "#ffffff";
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute("content", themeColor);
          metas[i].removeAttribute("media");
        }
      })();
    </script>
    <!--
      First-paint boot splash: visible before JS chunks parse. React.createRoot
      replaces #root contents on mount, so this disappears automatically.
    -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f5f6f8;
      }
      #root {
        min-height: 100%;
        min-height: 100lvh;
      }
      #octop-boot {
        /* fixed + inset: always viewport-centered before app CSS sets #root height */
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top, 0px))
          max(24px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(24px, env(safe-area-inset-left, 0px));
        margin: 0;
        /* Same composition as the shell's own splash: a soft brand wash gives
           the empty page a shape instead of a spinner floating in a void. */
        background: radial-gradient(
            720px 380px at 50% -8%,
            rgba(232, 93, 117, 0.11),
            transparent 68%
          ),
          #f5f6f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans SC", sans-serif;
        color: #4b5563;
        user-select: none;
        -webkit-user-select: none;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0e0e0e;
      }
      html[data-theme="dark"] #octop-boot {
        background: radial-gradient(
            720px 380px at 50% -8%,
            rgba(240, 139, 154, 0.1),
            transparent 68%
          ),
          #0e0e0e;
        color: rgba(255, 255, 255, 0.6);
      }
      .octop-boot-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: octop-boot-in 420ms ease-out both;
      }
      /* Horizontal lockup: dark wordmark on light, white on dark. */
      .octop-boot-logo {
        display: block;
        height: 72px;
        width: auto;
        max-width: min(260px, 75vw);
        object-fit: contain;
      }
      .octop-boot-logo-dark {
        display: none;
      }
      html[data-theme="dark"] .octop-boot-logo-light {
        display: none;
      }
      html[data-theme="dark"] .octop-boot-logo-dark {
        display: block;
      }
      /* Arc + status: same composition as BrandLoading / shell splash. */
      .octop-boot-status {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 24px 0 0;
        font-size: 16px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.01em;
      }
      .octop-boot-spinner {
        position: relative;
        display: block;
        width: 22px;
        height: 22px;
        flex: none;
      }
      .octop-boot-spinner-track {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 2px solid rgba(232, 93, 117, 0.14);
        border-radius: 50%;
      }
      html[data-theme="dark"] .octop-boot-spinner-track {
        border-color: rgba(240, 139, 154, 0.16);
      }
      .octop-boot-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          from 0deg,
          transparent 0%,
          transparent 55%,
          rgba(232, 93, 117, 0.4) 80%,
          #e85d75 100%
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 2px),
          #000 calc(100% - 2px + 0.5px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 2px),
          #000 calc(100% - 2px + 0.5px)
        );
        animation: octop-boot-spin 0.9s linear infinite;
      }
      html[data-theme="dark"] .octop-boot-spinner-ring {
        background: conic-gradient(
          from 0deg,
          transparent 0%,
          transparent 55%,
          rgba(240, 139, 154, 0.4) 80%,
          #f08b9a 100%
        );
      }
      @keyframes octop-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes octop-boot-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .octop-boot-stack,
        .octop-boot-spinner-ring {
          animation: none;
        }
      }
    </style>
    <!--
      Classic script (not type=module) so it runs even when hashed chunks 404.
      Shares octop:chunk-reload with reloadOnStaleChunk.ts.
    -->
    <script>
      (function () {
        // Chromium 91 and earlier do not provide this ES2022 API, while some
        // dashboard dependencies call it. Run before any ESM chunks evaluate.
        if (typeof Object.hasOwn !== "function") {
          Object.defineProperty(Object, "hasOwn", {
            value: function hasOwn(object, property) {
              return Object.prototype.hasOwnProperty.call(object, property);
            },
            configurable: true,
            writable: true,
          });
        }

        var KEY = "octop:chunk-reload";
        // Firefox fires error on <link rel="modulepreload"> for /assets/*.js
        // even when the file is fine; treating those as stale chunks caused
        // infinite location.reload() loops (and aborted real dynamic imports).
        var recovering = false;
        function isAsset(url) {
          return typeof url === "string" && url.indexOf("/assets/") !== -1;
        }
        function isStylesheetLink(el) {
          if (!el || el.tagName !== "LINK") return false;
          var rel = (el.rel || "").toLowerCase();
          return rel.indexOf("stylesheet") !== -1;
        }
        function recover() {
          if (recovering) return;
          try {
            if (sessionStorage.getItem(KEY) === "1") {
              sessionStorage.removeItem(KEY);
              return;
            }
            sessionStorage.setItem(KEY, "1");
          } catch (e) {}
          recovering = true;
          var reload = function () {
            location.reload();
          };
          var bust = Promise.resolve();
          if ("serviceWorker" in navigator) {
            bust = navigator.serviceWorker
              .getRegistrations()
              .then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister();
                  }),
                );
              });
          }
          if ("caches" in window) {
            bust = bust.then(function () {
              return caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k);
                  }),
                );
              });
            });
          }
          bust.then(reload, reload);
        }
        window.addEventListener(
          "error",
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return;
            if (t.tagName === "SCRIPT" && isAsset(t.src)) recover();
            // Only stylesheets — never modulepreload / preload (Firefox noise).
            if (isStylesheetLink(t) && isAsset(t.href)) recover();
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="octop-chrome"></div>
    <div id="octop-stage">
    <div id="root">
      <div id="octop-boot" role="status" aria-live="polite">
        <div class="octop-boot-stack">
          <img
            class="octop-boot-logo octop-boot-logo-light"
            src="%BASE_URL%logo_horizontal_dark.png"
            alt="Octop"
            height="72"
          />
          <img
            class="octop-boot-logo octop-boot-logo-dark"
            src="%BASE_URL%logo_horizontal_white.png"
            alt="Octop"
            height="72"
          />
          <p class="octop-boot-status">
            <span class="octop-boot-spinner" aria-hidden="true">
              <span class="octop-boot-spinner-track"></span>
              <span class="octop-boot-spinner-ring"></span>
            </span>
            <span id="octop-boot-text">Opening…</span>
          </p>
        </div>
      </div>
    </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("octop-boot-text");
        if (!el) return;
        try {
          var lang = (
            navigator.language ||
            navigator.userLanguage ||
            ""
          ).toLowerCase();
          if (lang.indexOf("zh") === 0) el.textContent = "正在打开…";
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
