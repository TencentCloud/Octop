# =============================================================================
# 政务伙伴 — Docker Compose（国内镜像）
#
# 本文件不本地构建，直接拉取已发布的镜像（GHCR，仓库名小写即镜像命名空间）。
# 若你的发布物在别处（内网仓库等），改下方 image 即可。
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.cn.yml up -d
#   AGENTBUDDY_PORT=9090 docker compose -f docker/docker-compose.cn.yml up -d
#   AGENTBUDDY_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.cn.yml up -d
#
# 环境变量与 docker-compose.yml 相同。docker/.env 仅用于 Compose 插值；
# 变量必须列在下方 environment 才会进入容器。
# =============================================================================

services:
  agentbuddy:
    image: ghcr.io/kolehank/octop:latest
    container_name: agentbuddy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${AGENTBUDDY_PORT:-8088}:${AGENTBUDDY_PORT:-8088}"
    volumes:
      - ${AGENTBUDDY_DATA:-~/.agentbuddy}:/data/.agentbuddy
    environment:
      - HOME=/data
      - AGENTBUDDY_BIND_HOST=0.0.0.0
      - AGENTBUDDY_PORT=${AGENTBUDDY_PORT:-8088}
      - AGENTBUDDY_LOG_LEVEL=${AGENTBUDDY_LOG_LEVEL:-info}
      - AGENTBUDDY_DEFAULT_PASSWORD=${AGENTBUDDY_DEFAULT_PASSWORD:-}
      - AGENTBUDDY_ADMIN_USERNAME=${AGENTBUDDY_ADMIN_USERNAME:-admin}
      - AGENTBUDDY_ADMIN_DISPLAY_NAME=${AGENTBUDDY_ADMIN_DISPLAY_NAME:-Admin}
      - AGENTBUDDY_DATABASE_URL=${AGENTBUDDY_DATABASE_URL:-}
      - AGENTBUDDY_DATABASE_DRIVER=${AGENTBUDDY_DATABASE_DRIVER:-}
      - AGENTBUDDY_DATABASE_SQLITE_PATH=${AGENTBUDDY_DATABASE_SQLITE_PATH:-}
      - AGENTBUDDY_DATABASE_HOST=${AGENTBUDDY_DATABASE_HOST:-}
      - AGENTBUDDY_DATABASE_PORT=${AGENTBUDDY_DATABASE_PORT:-}
      - AGENTBUDDY_DATABASE_NAME=${AGENTBUDDY_DATABASE_NAME:-}
      - AGENTBUDDY_DATABASE_USER=${AGENTBUDDY_DATABASE_USER:-}
      - AGENTBUDDY_DATABASE_PASSWORD=${AGENTBUDDY_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
