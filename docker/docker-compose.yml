# =============================================================================
# agentbuddy — Docker Compose
#
# 用法（在仓库根目录执行）:
#   docker compose -f docker/docker-compose.yml up -d
#   AGENTBUDDY_PORT=9090 docker compose -f docker/docker-compose.yml up -d
#   AGENTBUDDY_DEFAULT_PASSWORD=<your-strong-password> docker compose -f docker/docker-compose.yml up -d
#
# 可在 docker/ 目录放置 .env 文件，例如:
#   AGENTBUDDY_PORT=9090
#   AGENTBUDDY_DEFAULT_PASSWORD=<your-strong-password>
#   AGENTBUDDY_ADMIN_USERNAME=admin
#   AGENTBUDDY_DATABASE_DRIVER=postgresql
#   AGENTBUDDY_DATABASE_URL=postgresql://octop:octop@host.docker.internal:5432/octop
#
# 注意: docker/.env 仅用于 Compose 插值；变量必须列在下方 environment
# 才会进入容器。也可写入数据卷内的 ~/.agentbuddy/env（宿主机挂载目录下的 env）。
# 密码须 ≥8 位且同时包含字母与数字（与控制台改密策略一致）。
# 未设置或未通过策略时不自动建管理员，打开页面走设置向导
# （向导口令写入 /data/.agentbuddy/octop-login.txt）。
# =============================================================================

services:
  agentbuddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agentbuddy:latest
    container_name: agentbuddy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "${AGENTBUDDY_PORT:-8088}:${AGENTBUDDY_PORT:-8088}"
    volumes:
      - ${AGENTBUDDY_DATA:-~/.agentbuddy}:/data/.agentbuddy
    environment:
      - HOME=/data
      - AGENTBUDDY_BIND_HOST=0.0.0.0
      - AGENTBUDDY_PORT=${AGENTBUDDY_PORT:-8088}
      - AGENTBUDDY_LOG_LEVEL=${AGENTBUDDY_LOG_LEVEL:-info}
      - AGENTBUDDY_DEFAULT_PASSWORD=${AGENTBUDDY_DEFAULT_PASSWORD:-}
      - AGENTBUDDY_ADMIN_USERNAME=${AGENTBUDDY_ADMIN_USERNAME:-admin}
      - AGENTBUDDY_ADMIN_DISPLAY_NAME=${AGENTBUDDY_ADMIN_DISPLAY_NAME:-Admin}
      - AGENTBUDDY_DATABASE_URL=${AGENTBUDDY_DATABASE_URL:-}
      - AGENTBUDDY_DATABASE_DRIVER=${AGENTBUDDY_DATABASE_DRIVER:-}
      - AGENTBUDDY_DATABASE_SQLITE_PATH=${AGENTBUDDY_DATABASE_SQLITE_PATH:-}
      - AGENTBUDDY_DATABASE_HOST=${AGENTBUDDY_DATABASE_HOST:-}
      - AGENTBUDDY_DATABASE_PORT=${AGENTBUDDY_DATABASE_PORT:-}
      - AGENTBUDDY_DATABASE_NAME=${AGENTBUDDY_DATABASE_NAME:-}
      - AGENTBUDDY_DATABASE_USER=${AGENTBUDDY_DATABASE_USER:-}
      - AGENTBUDDY_DATABASE_PASSWORD=${AGENTBUDDY_DATABASE_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - LANGFUSE_TRACING_ENABLED=${LANGFUSE_TRACING_ENABLED:-true}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
