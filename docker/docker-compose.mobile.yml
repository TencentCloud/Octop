# =============================================================================
# agentbuddy — Remote Phone (mobile) compose overlay for local / DinD testing
#
# Usage (from repo root):
#   # once: download platform-tools next to the repo
#   mkdir -p .tools && cd /tmp && curl -fsSL -o pt.zip \
#     https://dl.google.com/android/repository/platform-tools-latest-linux.zip \
#     && unzip -qo pt.zip -d /workspace/agentbuddy/.tools
#
#   docker compose -f docker/docker-compose.mobile.yml up -d --build
#
# This file is standalone (not an overlay) because ``network_mode: host``
# conflicts with published ``ports`` from the base compose file.
#
# Host prerequisites:
# - Docker socket usable by the container
# - /dev/binder or /dev/binderfs on the host
# - Enough free disk for the Redroid image
# =============================================================================

services:
  agentbuddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agentbuddy:latest
    container_name: agentbuddy
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    privileged: true
    network_mode: host
    volumes:
      - ${AGENTBUDDY_DATA:-~/.agentbuddy}:/data/.agentbuddy
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/binderfs:/dev/binderfs
      - ${AGENTBUDDY_PLATFORM_TOOLS:-../.tools/platform-tools}:/opt/android-sdk/platform-tools:ro
    environment:
      - HOME=/data
      - AGENTBUDDY_BIND_HOST=0.0.0.0
      - AGENTBUDDY_PORT=${AGENTBUDDY_PORT:-8088}
      - AGENTBUDDY_LOG_LEVEL=${AGENTBUDDY_LOG_LEVEL:-info}
      - AGENTBUDDY_DEFAULT_PASSWORD=${AGENTBUDDY_DEFAULT_PASSWORD:-}
      - AGENTBUDDY_ADMIN_USERNAME=${AGENTBUDDY_ADMIN_USERNAME:-admin}
      - AGENTBUDDY_MOBILE_ADB_HOST=${AGENTBUDDY_MOBILE_ADB_HOST:-127.0.0.1:5555}
      - AGENTBUDDY_MOBILE_CONTAINER=${AGENTBUDDY_MOBILE_CONTAINER:-octop-mobile-android}
      - AGENTBUDDY_ENABLE_MOBILE=${AGENTBUDDY_ENABLE_MOBILE:-1}
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
