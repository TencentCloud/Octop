# This file contains the configuration for this project.
# When you update `info`, run `wails3 task common:update:build-assets` to refresh generated assets.
version: "3"

info:
  companyName: "Octop"
  productName: "Octop"
  productIdentifier: "com.tencent.octop"
  description: "Octop desktop shell"
  copyright: "(c) 2026, Octop"
  comments: "Wails v3 + green portable"
  version: "0.9.26"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - assets
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary

fileAssociations: []
