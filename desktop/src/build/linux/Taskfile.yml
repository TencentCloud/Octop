version: "3"

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: "{{.ARCH | default ARCH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages the production binary with its matching portable runtime
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - test -f {{.PORTABLE_ZIP}}
      - rm -rf {{.PACKAGE_DIR}}
      - mkdir -p {{.PACKAGE_DIR}}
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.PACKAGE_DIR}}/
      - cp {{.PORTABLE_ZIP}} {{.PACKAGE_DIR}}/
      - rm -f {{.BIN_DIR}}/{{.APP_NAME}}-Desktop-linux-{{.ARCH}}.tar.gz
      - tar -C {{.BIN_DIR}} -cf {{.ARCHIVE}} {{.APP_NAME}}-Desktop-linux-{{.ARCH}}
    vars:
      ARCH: "{{.ARCH | default ARCH}}"
      PORTABLE_ZIP: '{{.PORTABLE_ZIP | default (printf "../portable/release/Octop-linux-%s.zip" .ARCH)}}'
      PACKAGE_DIR: '{{.BIN_DIR}}/{{.APP_NAME}}-Desktop-linux-{{.ARCH}}'
      ARCHIVE: '{{.PACKAGE_DIR}}.tar'

  run:
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}}"
