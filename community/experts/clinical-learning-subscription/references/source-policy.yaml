# 核验分档：普通教育性问答走快速核验；只有高风险事实或明确的版本/原文
# 请求才升级为完整核验。快速核验不是降低权威标准，而是减少重复来源与无效字段。
fast_verification_required_checks:
  - authoritative_owner_and_domain
  - normative_document_type
  - title
  - issuing_organization
  - publication_year_or_version
  - readable_body_covering_the_claim

full_verification_trigger_fact_types:
  - latest_current_replaced_or_withdrawn_status
  - cross_version_comparison
  - exact_recommendation_or_evidence_grade
  - exact_section_table_page_or_item_locator
  - approved_indication
  - contraindication
  - dosage_and_administration
  - pregnancy_or_pediatric_use
  - serious_adverse_reaction
  - invasive_or_emergency_action
  - legal_regulatory_or_reimbursement_status

# 国际来源仍全部保留 A 级资格，但默认检索池固定为五站。普通国际补充只定向
# 一个最匹配站点；首站确实不覆盖问题时最多增加一个，不得并行铺开。
international_default_pool:
  - who
  - nice
  - esc
  - ada
  - kdigo

international_specialty_direct_pool:
  - acg
  - aga
  - asge
  - esge
  - easl
  - aasld
  - ecco
  - gold
  - gina

# 正常目标是 1 次定向搜索 + 1 次正文抓取；以下只是整个用户回合的硬上限，
# 包括失败、超时、降级、补链和改稿。任何阶段均不得重置或并行耗尽预算。
retrieval_budget_hard_limits:
  - searchfree_search_max_3
  - web_fetch_max_3
  - international_sites_normally_1
  - international_sites_absolute_max_2
  - final_normative_documents_normally_1

# 信源分级（A 正式采集 / B 指南发现与受控承载 / C 全网发现与明确转述 / D 不入证据链）：
#   A 国内：卫健委/疾控/医保/药监及直属中心、中华医学会及分会、正式医学期刊平台、
#     中华预防医学会和经核验的专业组织；国际：WHO、NICE 及本文件登记的国际学会官方指南。
#   B：医脉通指南、PREPARE、MedSci、丁香园公开医学内容等，只用于发现并回溯原始出处；
#     指定 B+ 平台满足六项身份核验时，才可作为同一正式文件的正文承载渠道。
#   C：A/B 未找到时允许全网检索。只允许输出明确标注的“转述页面”，必须写出原始期刊或
#     指南身份及未核验状态；它不是最终证据，不支持精确推荐、证据等级或高风险药品信息。
#   D 不进入最终证据链（百科/问答/公众号等）。
# 权威域名只是第一道门槛；最终依据还必须通过文档类型与版本时效性核验。
#
# B+ 受控降级不是把整个平台升级为权威来源。只有原始正文因 412、验证码、
# JS 阻断、超时或正文不可获取而无法核对时，才允许把下列专业平台作为
# “正式全文承载渠道”；同时必须有一条 S/A 原始发布方或正式期刊元数据链接，
# 独立核对标题、制定机构、年份/版本及 DOI/文号。无法完成双重核验时仍只作线索。
secondary_evidence_required_checks:
  - title
  - issuing_organization
  - publication_year_or_version
  - doi_or_document_number
  - complete_normative_full_text
  - current_version_status

# C 级全网转述的强制披露字段。任意域名只有同时满足这些字段，才能作为
# “仅作背景”的转述页面出现在输出中；不得因此升级为最终证据或 B+ 正文承载。
attributed_relay_required_markers:
  - "转述页面（C级，仅作背景）"
  - "原始出处"
  - "核验状态"
  - "未取得可核验原文"

attributed_relay_required_identity_fields:
