# octop-memory-native bundle：在 profile 根部挂一个 Host 插件。
#
# 为什么不塞进 agent preset：插件只吃 `agent/created` / `agent/pre-step` /
# `session/event` 三个事件接缝，profile 级注册对**所有 preset**生效，也就不需要
# 再去 patch 那个手抄的「记忆共享模式」preset（少一处漂移源）。
#
# token 不写进仓库：由 octop 的 DSH 安装器在 profile 的 cordis.patch.yml 里用同 id
# 覆盖 config，或直接设环境变量后留空走 fallback 文件。
- insert:
    - id: octop-memory-native
      name: 'octop-memory-native'
      config:
        endpoint: ''
        token: ''
        tokenHeader: Authorization
        client: dsh
        configFallbackPath: '~/.dsh/hooks/config.json'
        recallEnabled: true
        recallMaxHits: 4
        recallMaxChars: 1200
        recallTimeoutMs: 4000
        recallMaxQueries: 4
        recallCorpus: all
        recallMinPromptChars: 4
        recallDedupeTtlMs: 300000
        captureEnabled: true
        captureTimeoutMs: 15000
        captureMaxChars: 8000
        sessionPrefix: 'dsh:'
        source: 'dsh:octop-memory-native'
