  # A 正式采集 — A级 官方/半官方学会与期刊
  - ".cma.org.cn"
  - ".cmda.net"
  - ".medjournals.cn"
  - ".cpma.org.cn"
  # A 正式采集 — 半官方行业组织与出版社
  - ".cha.org.cn"
  - ".csco.org.cn"
  - ".cnsoc.org"
  - ".pmph.com"
  # B 可增加 — 官方标准平台
  - ".std.samr.gov.cn"
  # 国际 S/A 原始信源；仍只放行正式指南/共识等规范性文档。
  - ".who.int"
  - ".nice.org.uk"
  - ".gi.org"
  - ".gastro.org"
  - ".asge.org"
  - ".esge.com"
  - ".easl.eu"
  - ".aasld.org"
  - ".ecco-ibd.eu"
  - ".escardio.org"

allowed_final_evidence_exact_domains:
