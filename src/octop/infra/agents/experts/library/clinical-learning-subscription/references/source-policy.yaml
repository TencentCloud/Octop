  - "cjournal.hep.com.cn"
  # A 正式采集 — 半官方行业组织与出版社
  - "www.cha.org.cn"
  - "www.csco.org.cn"
  - "www.cnsoc.org"
  - "cnsoc.org"
  - "www.pmph.com"
  # B 可增加 — 官方标准平台
  - "std.samr.gov.cn"

# B+ 可信二级指南承载平台。只有完成标题、文档类型、制定机构、年份/版本、
# 正式出处、全文完整性和新版状态核验的正式指南/共识全文才可作最终依据。
allowed_secondary_fulltext_domain_suffixes:
  - ".medlive.cn"
  - ".dxy.cn"

allowed_secondary_fulltext_exact_domains:
  - "medlive.cn"
  - "dxy.cn"

# B 正规学术全文承载平台。只接受实际取得并核验的正式期刊指南/共识全文；
# 只有题录或摘要时不得据此生成具体指南要点。
allowed_academic_fulltext_domain_suffixes:
  - ".cnki.net"
  - ".wanfangdata.com.cn"
  - ".cqvip.com"

allowed_academic_fulltext_exact_domains:
  - "cnki.net"
  - "wanfangdata.com.cn"
  - "cqvip.com"

# B- 题录与版本核验源，不作最终正文来源。
metadata_verification_domain_suffixes:
  - ".sinomed.ac.cn"

metadata_verification_exact_domains:
  - "sinomed.ac.cn"

# C 发现源，不作最终证据。
discovery_only_domain_suffixes:
  - ".medsci.cn"
  - ".guidelines-registry.cn"

discovery_only_exact_domains:
  - "medsci.cn"
  - "guidelines-registry.cn"

# D 不进入最终证据链。
blocked_final_evidence_domains:
  - "mp.weixin.qq.com"
  - "www.baidu.com"
  - "baidu.com"
  - "baike.baidu.com"
  - "www.zhihu.com"
  - "zhihu.com"
  - "zhuanlan.zhihu.com"

blocked_capabilities:
  - disease_sop
  - emergency_action_card
  - patient_case_advice
  - medication_dosage_generation
  - prescription_generation
  - his_decision_support
  - insurance_reimbursement_decision

# 仅在 clinical_safety_modules 内生效。
# 模式必须加词边界，避免误伤 delivery / import / point / 5 g 数据 等普通文本；
# 医学语境靠“药名/剂量/给药”组合词而非裸词片段来识别。
blocked_output_patterns:
  - "\\d+(\\.\\d+)?\\s*(mg|g|ug|μg|ml|mL|IU|U)\\s*(/\\s*(kg|m2|㎡|次|日|天|d))"
  - "(?<![A-Za-z])(每次|单次|首剂|负荷剂量)\\s*\\d+(\\.\\d+)?\\s*(mg|g|ug|μg|ml|mL|IU|U)"
  - "(?<![A-Za-z])(bid|tid|qid|qd|qn|qod|q\\d+h|ivgtt|iv\\s*drip)(?![A-Za-z])"
  - "(?<![A-Za-z])(po|im|iv|sc|ih)(?![A-Za-z])\\s*(给药|用药|注射|输注|\\d)"
  - "(口服|静滴|静注|肌注|皮下注射|雾化吸入|舌下含服)\\s*\\d+(\\.\\d+)?\\s*(mg|g|ug|μg|ml|mL|IU|U)?"
  - "首剂\\s*(加倍|\\d+)"
  - "急诊行动卡"
  - "疾病\\s*SOP"
  - "【具体用药】"
  - "【立即处理】"
  - "【处方】"
  - "HIS.*(提示|校验|配置)"
  - "(该|这位|此)患者\\s*(应|需|建议|可以)\\s*(诊断为|给予|使用|服用|立即)"
