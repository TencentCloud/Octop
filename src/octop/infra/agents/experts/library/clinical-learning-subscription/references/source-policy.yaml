  - ".chinacdc.cn"
  # A 正式采集 — A级 官方/半官方学会与期刊
  - ".cma.org.cn"
  - ".cmda.net"
  - ".medjournals.cn"
  - ".cpma.org.cn"
  # A 正式采集 — 半官方行业组织与出版社
  - ".cha.org.cn"
  - ".csco.org.cn"
  - ".cnsoc.org"
