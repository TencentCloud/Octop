independent_professional_societies:
  - id: chinese-pharmaceutical-association
    name: 中国药学会
    aliases: [药学, 临床药学, 医院药学, 合理用药]
    official_url: https://www.cpa.org.cn/
    canonical_domains: [cpa.org.cn, "*.cpa.org.cn"]
    authority_scope: 中国药学会正式发布的团体标准、指南、规范及其更正公告
    evidence_status: conditional_final
    acceptance_evidence:
      - T/CPHARMA 002-2019《药物流行病学研究方法学指南》
      - T/CPHARMA 004-2020《医疗机构胰岛素安全使用管理规范》
      - T/CPHARMA 008-2025《突发事件应急保障药品目录编制规范》
  - id: chinese-stroke-association
    name: 中国卒中学会
    aliases: [卒中, 脑卒中, 脑血管病, 神经内科]
    official_url: https://www.csa-stroke.com/
    canonical_domains: [csa-stroke.com, "*.csa-stroke.com"]
    authority_scope: 学会及其分会发布的指南、共识身份与发布信息
    evidence_status: official_discovery_pending_fulltext_acceptance
    caution: 发布新闻或目录页只能定位原文；取得完整正式正文并核验身份后才可作最终依据。
  - id: chinese-association-of-rehabilitation-medicine
    name: 中国康复医学会
    aliases: [康复医学, 康复科, 物理医学与康复]
    official_url: https://www.carm.org.cn/
    canonical_domains: [carm.org.cn, "*.carm.org.cn"]
    authority_scope: 学会及其专业委员会发布的标准、指南、共识身份与发布信息
    evidence_status: official_discovery_pending_fulltext_acceptance
    caution: 科普、竞赛、会议和转载页面不得作为正式指南或共识原文。
  - id: chinese-nursing-association
    name: 中华护理学会
    aliases: [护理, 护理管理, 基层护理]
    official_url: https://www.cna-cn.com/
    canonical_domains: [cna-cn.com, "*.cna-cn.com", zhhlxh.org.cn, "*.zhhlxh.org.cn"]
    authority_scope: 学会正式发布的护理团体标准、指南或规范身份信息
    evidence_status: official_discovery_pending_fulltext_acceptance
    caution: 会员、直播、培训和新闻页面只作发现线索。
