schema_version: 1
purpose: >-
  为中国医学专业学会、协会及其专科分会提供确定的检索路由。
  本表用于减少全网搜索猜测，不会把整个网站的所有内容自动升级为最终证据。
verified_at: 2026-08-25

evidence_contract:
  final_content_types:
    - 正式指南或共识原文
    - 正式规范、临床路径、质控标准或团体标准原文
    - 正式更正、撤回、替代或版本说明
  discovery_only_content_types:
    - 新闻或发布报道
    - 会议、培训或活动信息
    - 科普、解读、访谈或转载
    - 征求意见稿、立项公告或注册信息
  rule: >-
    域名命中只证明可进入该机构的检索路由；最终引用仍须核对文档类型、
    完整标题、制定或发布机构、年份或版本、DOI或文号、正文完整性和现行状态。

chinese_medical_association:
  name: 中华医学会
  official_directory_url: https://www.cma.org.cn/col/col183/index.html
  canonical_domains:
    - cma.org.cn
    - "*.cma.org.cn"
    - medjournals.cn
    - "*.medjournals.cn"
    - rs.yiigle.com
  route_policy: >-
    先按专科分会名称或别名匹配；已登记专属子域时先限定该子域检索，
    否则先在中华医学会官方目录确认分会身份，再限定 cma.org.cn 与正式期刊平台检索。
  known_branch_sites:
    - branch: 呼吸病学分会
      aliases: [呼吸科, 呼吸与危重症医学科, CTS]
      canonical_url: https://ctschina.cma.org.cn/
      domain: ctschina.cma.org.cn
    - branch: 糖尿病学分会
      aliases: [糖尿病, 内分泌科, CDS]
      canonical_url: https://diab.cma.org.cn/cn/index.aspx
      domain: diab.cma.org.cn
    - branch: 心血管病学分会
      aliases: [心血管内科, 心内科, CSC]
      canonical_url: https://csc.cma.org.cn/index.html
      domain: csc.cma.org.cn
